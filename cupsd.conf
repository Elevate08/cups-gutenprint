# Listen everywhere; restrict who can reach port 631 with the network, not here.
Listen *:631
Listen /run/cups/cups.sock
ServerAlias *
DefaultEncryption Never

LogLevel warn
ErrorLog stderr
AccessLog stderr
PageLog stderr

# Advertise shared queues over DNS-SD (through Avahi).
Browsing Yes
BrowseLocalProtocols dnssd
DefaultShared Yes
WebInterface Yes

DefaultAuthType Basic

# Anyone who can reach the server may print and view status.
<Location />
  Order allow,deny
  Allow all
</Location>
# Administration only from inside the container (queues are created by the
# setup script at start-up), so no admin credentials exist.
<Location /admin>
  Order allow,deny
  Allow localhost
</Location>
<Location /admin/conf>
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>
  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Order deny,allow
  </Limit>
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    Order allow,deny
    Allow localhost
  </Limit>
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
