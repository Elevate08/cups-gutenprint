name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly, for Debian security updates
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ghcr.io/elevate08/cups-gutenprint:1.${{ github.run_number }}
            ghcr.io/elevate08/cups-gutenprint:latest
      - name: smoke test
        run: |
          docker run --rm --entrypoint sh ghcr.io/elevate08/cups-gutenprint:1.${{ github.run_number }} -c '
            cupsd && sleep 3
            echo "gutenprint models: $(lpinfo -m | grep -c gutenprint)"
            lpinfo -m | grep -i "mp495" || true
            ls /usr/lib/cups/backend/
            test "$(lpinfo -m | grep -c gutenprint)" -gt 100'
